name: Build xdfaaa ai APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3' 
          channel: stable

      - name: Prepare Project
        run: |
          # 1. Buat project Flutter bersih di folder lokal (./build_src)
          flutter create --platforms=android --org com.xdfaaa --project-name xdfaaa_ai ./build_src
          
          # 2. Salin file dari repo user ke folder ./build_src
          if [ -f "pubspec.yaml" ]; then cp pubspec.yaml ./build_src/
          elif [ -f "files/pubspec.yaml" ]; then cp files/pubspec.yaml ./build_src/; fi

          if [ -d "lib" ]; then cp -r lib ./build_src/
          elif [ -d "files/lib" ]; then cp -r files/lib ./build_src/; fi

          mkdir -p ./build_src/assets
          if [ -d "assets" ]; then cp -r assets/* ./build_src/assets/ 2>/dev/null || true
          elif [ -d "files/assets" ]; then cp -r files/assets/* ./build_src/assets/ 2>/dev/null || true; fi

          # 3. TULIS ULANG build.gradle secara langsung (Aman & Anti Error)
          cat << 'EOF' > ./build_src/android/app/build.gradle
          plugins {
              id "com.android.application"
              id "kotlin-android"
              id "dev.flutter.flutter-gradle-plugin"
          }
          android {
              namespace = "com.xdfaaa.xdfaaa_ai"
              compileSdk = 35
              ndkVersion = "27.0.12077973"
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
              defaultConfig {
                  applicationId = "com.xdfaaa.xdfaaa_ai"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 6
                  versionName = "1.3.0"
              }
              buildTypes {
                  release {
                      signingConfig = signingConfigs.debug
                      minifyEnabled = false
                      shrinkResources = false
                  }
              }
          }
          flutter { source = '../..' }
          EOF

          # 4. TULIS ULANG AndroidManifest.xml (Izin Akses)
          cat << 'EOF' > ./build_src/android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />
              <application
                  android:label="xdfaaa ai"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher"
                  android:largeHeap="true"
                  android:usesCleartextTraffic="true"
                  android:hardwareAccelerated="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data android:name="io.flutter.embedding.android.NormalTheme" android:resource="@style/NormalTheme" />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <meta-data android:name="flutterEmbedding" android:value="2" />
              </application>
          </manifest>
          EOF

      - name: Get dependencies
        working-directory: ./build_src
        run: flutter pub get

      - name: Generate launcher icons
        working-directory: ./build_src
        run: dart run flutter_launcher_icons

      - name: Clean and Build APK
        working-directory: ./build_src
        run: |
          flutter clean
          flutter build apk --release --split-per-abi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: xdfaaa-ai-apk
          path: ./build_src/build/app/outputs/flutter-apk/*.apk
