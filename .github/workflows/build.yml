name: Build xdfaaa ai APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3' 
          channel: stable

      - name: Prepare Project
        run: |
          # 1. Buat project Flutter bersih (otomatis membuat MainActivity yang benar)
          flutter create --platforms=android --org com.xdfaaa --project-name xdfaaa_ai /tmp/app
          
          # 2. Salin file dari repo user ke folder /tmp/app
          if [ -f "pubspec.yaml" ]; then cp pubspec.yaml /tmp/app/
          elif [ -f "files/pubspec.yaml" ]; then cp files/pubspec.yaml /tmp/app/; fi

          if [ -d "lib" ]; then cp -r lib /tmp/app/
          elif [ -d "files/lib" ]; then cp -r files/lib /tmp/app/; fi

          mkdir -p /tmp/app/assets
          if [ -d "assets" ]; then cp -r assets/* /tmp/app/assets/ 2>/dev/null || true
          elif [ -d "files/assets" ]; then cp -r files/assets/* /tmp/app/assets/ 2>/dev/null || true; fi

          # 3. Ubah versi SDK secara otomatis via sed (TIDAK merusak MainActivity)
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 35/g' /tmp/app/android/app/build.gradle
          sed -i 's/ndkVersion = flutter.ndkVersion/ndkVersion = "27.0.12077973"/g' /tmp/app/android/app/build.gradle
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 26/g' /tmp/app/android/app/build.gradle
          sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 35/g' /tmp/app/android/app/build.gradle

          # 4. Tambahkan Izin Storage ke AndroidManifest
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET" \/>\n    <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" \/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" \/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" \/>' /tmp/app/android/app/src/main/AndroidManifest.xml

      - name: Get dependencies
        working-directory: /tmp/app
        run: flutter pub get

      - name: Generate launcher icons
        working-directory: /tmp/app
        run: dart run flutter_launcher_icons

      - name: Build APK
        working-directory: /tmp/app
        run: flutter build apk --release --split-per-abi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: xdfaaa-ai-apk
          path: /tmp/app/build/app/outputs/flutter-apk/*.apk
