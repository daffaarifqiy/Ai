name: Build xdfaaa ai APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: files

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable

      - name: Scaffold Android project
        run: |
          flutter create --platforms=android --org com.xdfaaa --project-name xdfaaa_ai /tmp/scaffold
          cp -r /tmp/scaffold/android ./android
          cp -r android_overrides/. android/

      # ⬇️ TAMBAHAN BARU: Menyalin PNG dari folder assets/ ke folder files/
      - name: Copy PNG Assets
        run: cp ../assets/*.png ./

      - name: Get dependencies
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: xdfaaa-ai-apk
          path: files/build/app/outputs/flutter-apk/app-release.apk
