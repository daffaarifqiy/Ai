name: Build xdfaaa ai APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: files

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3' 
          channel: stable

      - name: Scaffold Android project
        run: |
          flutter create --platforms=android --org com.xdfaaa --project-name xdfaaa_ai /tmp/scaffold
          cp -r /tmp/scaffold/android ./android
          cp -r android_overrides/. android/

      # ⬇️ TAMBAHAN BARU: Memperbaiki versi Kotlin & Android Gradle Plugin otomatis
      - name: Fix Kotlin and AGP Version
        run: |
          # Ubah Kotlin ke 2.1.0 (sesuai plugin llama)
          sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "2.1.0"/' android/settings.gradle
          # Ubah AGP ke 8.7.0 (agar support compileSdk 35)
          sed -i 's/id "com.android.application" version "[^"]*"/id "com.android.application" version "8.7.0"/' android/settings.gradle

      - name: Copy PNG Assets
        run: cp ../assets/*.png ./

      - name: Get dependencies
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: xdfaaa-ai-apk
          path: files/build/app/outputs/flutter-apk/app-release.apk
