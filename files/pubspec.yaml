name: xdfaaa_ai
description: "xdfaaa ai"
publish_to: 'none'
version: 1.5.2+10

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  llama_flutter_android: ^0.2.6
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.1
  permission_handler: ^11.0.1
  device_info_plus: ^11.0.0
  shared_preferences: ^2.2.2
  http: ^1.1.0
  flutter_highlight: ^0.7.0
  highlight: ^0.7.0
  webview_flutter: ^4.4.2
  cupertino_icons: ^1.0.6
  camera: ^0.10.5
  google_mlkit_face_detection: ^0.10.0
  face_verification: ^0.3.7
  path: ^1.8.3
  image: ^4.1.3
  file_picker: ^8.0.0
  url_launcher: ^6.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/ai.jpg.png
    - assets/ai.png.png
    - assets/admin.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/ai.png.png"
  min_sdk_android: 26
  adaptive_icon_background: "#0D1117"
  adaptive_icon_foreground: "assets/ai.png.png"
